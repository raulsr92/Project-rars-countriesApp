
<h1 class="mb-6 font-semibold text-2xl">Por Región</h1>
<h3 class="mb-6 text-lg">Seleccione una región: </h3>
<!--Botones-->

<div class="flex gap-x-8">
  @for (region of regions; track region) {

    <button
      class="w-[120px] btn btn-secondary btn-md text-white rounded-xl px-8 focus:outline-1 focus:outline-fuchsia-600 focus:bg-purple-600 active:outline-fuchsia-600 active:bg-purple-600"
      (click)="query.set(region)"
      [class.outline-fuchsia-600]="query()===region"
    >
      {{region.toUpperCase()}}

    </button>

  }
</div>

<country-list
    [countriesInput]="countryResource.value() ?? []"
    [errorMessage]="countryResource.error()"
    [isEmpty]="countryResource.value()?.length===0"
    [isLoading]="countryResource.isLoading()"
/>
